apiVersion:  apps/v1
kind: Deployment
metadata: 
  name: myapp
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports: 
            - containerPort: 80

